{{define "content"}}
<h1 class="text-2xl font-bold mb-6">Review queues</h1>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
  <section class="bg-white rounded-lg shadow p-4">
    <h2 class="font-semibold mb-3">Extraction review</h2>
    <p class="text-xs text-slate-500 mb-3">Forms whose extracted JSON failed post-validation.</p>
    {{template "request-table" .Extraction}}
  </section>
  <section class="bg-white rounded-lg shadow p-4">
    <h2 class="font-semibold mb-3">Decision review</h2>
    <p class="text-xs text-slate-500 mb-3">Forms whose Gemma score did not auto-approve.</p>
    {{template "request-table" .Decision}}
  </section>
</div>
{{end}}
